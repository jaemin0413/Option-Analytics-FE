# gateway Nginx의 두 공개 server 블록(443, Funnel)에 include 한다.
# /api/는 각 server 블록에 이미 Option 백엔드로 연결돼 있다.

location = /option {
    return 302 /option/;
}

# 파일 이름에 해시가 붙어 있어서 오래 캐시해도 된다
location ^~ /option/assets/ {
    root /var/www;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# 화면 주소(/option/ticker/NVDA 등)는 전부 index.html로 보낸다
location /option/ {
    root /var/www;
    add_header Cache-Control "no-cache";
    try_files $uri /option/index.html;
}
